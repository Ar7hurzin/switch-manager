name: Switch Manager validation
on:
  push:
    branches: [main, 'redesign/**', 'feature/**']
  pull_request:
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - run: node --test tests/frontend_reliability.cjs
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - name: Smoke test container
        shell: bash
        run: |
          trap 'docker compose down -v' EXIT
          printf 'https://idp.example.test\nci-client\n\nci@example.test\n\n\n\n' | docker compose run --rm -T app configure
          docker compose up -d
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/api/health | python -c 'import json,sys; assert json.load(sys.stdin)["auth_configured"]'
          curl -fsS http://127.0.0.1:8787/login | grep -q 'sso-login'
          docker compose down
          docker compose up -d
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8787/api/health | python -c 'import json,sys; assert json.load(sys.stdin)["auth_configured"]'
